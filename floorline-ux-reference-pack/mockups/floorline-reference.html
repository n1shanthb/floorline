<script>

const icon={overview:'◫',treasury:'◈',loans:'◇',governance:'♧',activity:'◷'};
function brand(){return `<div class="brand"><span class="brandmark">✦</span>floorline.</div>`}
function badge(){return `<span class="pill purple">● NEAR TESTNET</span>`}
function linechart(){return `<svg viewBox="0 0 650 190" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7659ED" stop-opacity=".19"/><stop offset="1" stop-color="#7659ED" stop-opacity="0"/></linearGradient></defs><path d="M8 152 L200 152 L200 124 L425 124 L425 34 L642 34 L642 190 L8 190 Z" fill="url(#fade)"/><path d="M8 152 L200 152 L200 124 L425 124 L425 34 L642 34" fill="none" stroke="#7659ED" stroke-width="4" stroke-linejoin="round"/><circle cx="8" cy="152" r="6" fill="#7659ED" stroke="white" stroke-width="3"/><circle cx="200" cy="124" r="6" fill="#7659ED" stroke="white" stroke-width="3"/><circle cx="425" cy="34" r="6" fill="#7659ED" stroke="white" stroke-width="3"/><circle cx="642" cy="34" r="6" fill="#7659ED" stroke="white" stroke-width="3"/></svg>`}
function event(icon,title,sub,right='↗'){return `<div class="eventrow"><div class="eventicon">${icon}</div><div class="eventbody"><strong>${title}</strong><p>${sub}</p></div><span class="muted small">${right}</span></div>`}
function header(){return `<div class="header">${brand()}<div class="headerlinks"><span>How it works</span><span>Protocol</span><span>Activity</span><span>Docs ↗</span></div><div class="header-right">${badge()}<span class="pill white">Launch app ↗</span></div></div>`}
