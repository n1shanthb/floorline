[package]
name = "floorkit-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uint = "=0.9.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
borsh = "=1.8.1"

[features]
default = []
contract = []
fault-callback = []

[dev-dependencies]
serde_json = "=1.0.154"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
