[package]
name = "floorline-kill-test"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uint = "=0.9.5"

[dev-dependencies]
num-bigint = "=0.3.3"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
borsh = "1"

[features]
default = []
contract = []
fault-injection = []
short-quarantine = []

